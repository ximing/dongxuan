# Origin address is kept only on the ingress machine, outside the tracked site file.
include /root/apps/nginx/sites/aimo.plus/dx-origin.upstream;

server {
    listen 80;
    server_name dx.aimo.plus;
    return 301 https://dx.aimo.plus$request_uri;
}

server {
    listen 443 ssl;
    server_name dx.aimo.plus;
    charset utf-8;
    ssl_certificate /root/apps/nginx/ssl/aimo.plus.cer;
    ssl_certificate_key /root/apps/nginx/ssl/aimo.plus.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 30m;
    client_max_body_size 6m;

    location / {
        proxy_pass http://dx_aimo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
